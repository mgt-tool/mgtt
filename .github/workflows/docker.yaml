# The image from main, for anyone tracking the edge.
#
# Pushes to main publish `edge` and `sha-<commit>`, and nothing else: `latest`
# belongs to the newest release and is written only by the release workflow,
# so that `latest` never runs ahead of what the changelog and the Go proxy
# call the latest version.

name: docker

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  edge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # What the binary in an edge image calls itself: not a version, because
      # it is not one.
      - id: edge
        run: echo "version=edge+$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=edge
            type=sha,prefix=sha-
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.edge.outputs.version }}
