description: A stateless service in front of a store.

facts:
  reachable:
    type: mgtt.bool
    ttl: 30s
    probe:
      cmd: "minishop-cli ping {name}"
      parse: bool
      cost: low

healthy:
  - reachable == true

states:
  up:
    when: "reachable == true"
    description: serving requests
  down:
    when: "reachable == false"
    description: not serving
    # `triggered_by` names the failures that cross a dependency edge into
    # this state: a dependency whose failing state declares
    # `can_cause: [connection_refused]` can put this component into `down`.
    # A failure state that lists none takes any label a dependency can cause.
    triggered_by: [connection_refused]

default_active_state: up
