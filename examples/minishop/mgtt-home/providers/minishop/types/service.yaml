description: A stateless service in front of a store.

facts:
  reachable:
    type: mgtt.bool
    ttl: 30s
    probe:
      cmd: "minishop-cli ping {name}"
      parse: bool
      cost: low

healthy:
  - reachable == true

states:
  up:
    when: "reachable == true"
    description: serving requests
  down:
    when: "reachable == false"
    description: not serving
    # `triggered_by` is how a failure crosses a dependency edge: a
    # dependency whose failing state declares `can_cause: [connection_refused]`
    # can put this component into `down`. Without it a model has origination
    # moves but no propagation, and nothing a failure chain could be read from.
    triggered_by: [connection_refused]

default_active_state: up
