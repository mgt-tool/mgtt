    - acme-shop-ingress
    - acme-shop-nginx-blue
    - acme-shop-nginx-green
    - acme-shop-php-fpm-blue
    - acme-shop-php-fpm-green
    - acme-shop-svc
    - mq
    - opensearch
    - rds
    - redis
    - media-bucket
    - ssm-app-config
