site_name: mgtt
site_url: https://mgt-tool.github.io/mgtt
repo_url: https://github.com/mgt-tool/mgtt
repo_name: mgt-tool/mgtt
docs_dir: docs

# Exclude internal design specs and plans from the published site.
# Kept locally (gitignored) for contributor reference, but not shipped.
exclude_docs: |
  superpowers/

# Wire the {{ MGTT_VERSION }} placeholder so docs source the version
# from the repo's VERSION file at build time — no manual sync.
hooks:
  - docs/_hooks/version_substitute.py
  - docs/_hooks/registry_generator.py

theme:
  name: material
  logo: images/mgtt_icon_medium.png
  favicon: images/mgtt_icon_32px.png
  palette:
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md
  - Quick start: getting-started/quickstart.md
  - How it works: concepts/how-it-works.md
  - AI agents (MCP): guides/agents.md
  - Providers:
    - Using providers: guides/providers.md
    - Writing a provider: providers/writing.md
    - Registry: reference/registry.md
  - Reference:
    - Model and scenarios: reference/model.md
    - CLI and configuration: reference/cli.md

extra_css:
  - stylesheets/terminal.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true
